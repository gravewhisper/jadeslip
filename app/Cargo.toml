[package]
name = "jadeslip"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "A fast desktop EPUB reader that lets you fix the book while you read it"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "jadeslip"
path = "src/main.rs"

[features]
e2e = ["dep:cairo-rs", "dep:gdk-sys", "dep:glib", "dep:glib-sys", "dep:gobject-sys", "dep:gtk", "dep:gtk-sys", "dep:webkit2gtk"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jadeslip-core = { path = "../crates/core" }
tauri = { version = "~2.12", default-features = false, features = ["wry", "x11", "custom-protocol"] }

cairo-rs = { version = "0.18", features = ["png"], optional = true }
gdk-sys = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
glib-sys = { version = "0.18", optional = true }
gobject-sys = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }
gtk-sys = { version = "0.18", optional = true }
webkit2gtk = { version = "2", optional = true }
tauri-plugin-dialog = "2"
