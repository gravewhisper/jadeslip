name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxml2-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate test books
        run: cargo run --release --locked -p jadeslip-fixtures --bin gen-fixtures
      - name: Allow user namespaces for the full-disk tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy for the e2e build
        run: cargo clippy --workspace --all-targets --locked --features jadeslip/e2e -- -D warnings
      - name: No comments
        run: python3 tests/check_no_comments.py
