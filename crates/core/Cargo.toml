[package]
name = "jadeslip-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
crc32fast = "1"
cssparser = "0.38"
encoding_rs = "0.8"
libc = "0.2"
memchr = "2"
serde = { version = "1", features = ["derive"] }
miniz_oxide = "0.9"
regex = "1"
serde_json = "1"
sha2 = "0.10"
spellbook = "0.4"
zlib-rs = { version = "0.6", default-features = false, features = ["std", "rust-allocator"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"
roxmltree = "0.21"
jadeslip-fixtures = { path = "../fixtures" }
