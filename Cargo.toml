[workspace]
resolver = "3"
members = ["app", "crates/core", "crates/worker", "crates/fixtures", "tests/e2e"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/gravewhisper/jadeslip"
homepage = "https://github.com/gravewhisper/jadeslip"

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.encoding_rs]
opt-level = 3

[profile.dev.package.jadeslip-fixtures]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
